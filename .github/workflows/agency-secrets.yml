name: Agency secrets to Cloudflare Pages

# Copies AGENCY_AGENT_TOKEN (the bearer token of the agency backend on ServerCesar) from
# GitHub secrets to the cesar-solla Pages project, then redeploys so Functions see it.
# agency-backend/install.ps1 creates the token, stores it with DPAPI on the PC, sets the
# GitHub secret and dispatches this workflow. Run it again only to rotate the token.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Copy the agency token to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENCY_AGENT_TOKEN: ${{ secrets.AGENCY_AGENT_TOKEN }}
        run: |
          AGENCY_AGENT_TOKEN="$(printf '%s' "$AGENCY_AGENT_TOKEN" | tr -d '\r\n ')"
          if [ ${#AGENCY_AGENT_TOKEN} -lt 32 ]; then echo "AGENCY_AGENT_TOKEN missing or too short"; exit 1; fi
          printf '%s' "$AGENCY_AGENT_TOKEN" | npx --yes wrangler@4.124.0 pages secret put AGENCY_AGENT_TOKEN --project-name=cesar-solla

      - name: Redeploy so the new secret is live
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
