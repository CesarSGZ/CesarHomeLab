name: ServerCesar external wake test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/servercesar-wake-test.yml']
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Allow the local safety timer to be armed and the PC to hibernate
        run: sleep 120
      - name: Request wake through the existing web endpoint
        env:
          AGENT_TOKEN: ${{ secrets.SERVERCESAR_AGENT_TOKEN }}
        run: |
          test -n "$AGENT_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $AGENT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"delaySeconds":5}' \
            https://cesar-solla.pages.dev/api/agent/servercesar-wake-test
