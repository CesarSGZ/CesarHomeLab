name: ServerCesar external wake test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WOL_MAC: ${{ secrets.SERVERCESAR_MAC }}
      WOL_HOST: ${{ secrets.SERVERCESAR_HOST }}
      WOL_PORT: ${{ secrets.SERVERCESAR_WOL_PORT }}
    steps:
      - name: Validate existing target secrets
        run: test -n "$WOL_MAC" && test -n "$WOL_HOST" && test -n "$WOL_PORT"
      - name: Allow the local safety timer to be armed and the PC to hibernate
        run: sleep 120
      - name: Send three UDP magic packets directly to the configured router
        shell: python
        run: |
          import os, socket, time
          mac = bytes.fromhex(os.environ['WOL_MAC'].replace(':', '').replace('-', ''))
          assert len(mac) == 6
          packet = b'\xff' * 6 + mac * 16
          host = os.environ['WOL_HOST'].strip()
          port = int(os.environ['WOL_PORT'])
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
              for attempt in range(3):
                  assert sock.sendto(packet, (host, port)) == 102
                  print('Magic packet submitted', attempt + 1, flush=True)
                  time.sleep(10)

