name: D1 insights (manual)

# Lists the SQL statements that read the most D1 rows over the last day, to find what
# drains the free tier's 5,000,000 rows_read/day. Prints statistics only, no data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Top queries by rows read (24 h)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TRADING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.124.0 d1 insights cesar-mission-control --timePeriod 1d --sort-type sum --sort-by reads --limit 20 --json
