name: Agent Office read-only audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load isolated read credential
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
          OFFICE_WRANGLER_AUTH: ${{ secrets.OFFICE_WRANGLER_AUTH }}
        run: node scripts/office-development.mjs auth
      - name: Read current office state without executing agents
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/office-live-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-live-audit
          path: /tmp/office-live-audit.json
          retention-days: 3
