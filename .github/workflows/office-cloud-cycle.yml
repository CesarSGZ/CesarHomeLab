name: Agent Office cloud cycles
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: office-cloud-controller
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute actual paper trading and employee meetings
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/office-cloud-cycle.mjs
      - name: Pace cloud relay without spending model tokens
        if: always()
        run: sleep 240
      - name: Hand over to Cadaqui supervisor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/office-relay.mjs office-development.yml
