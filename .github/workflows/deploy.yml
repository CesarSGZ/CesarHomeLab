name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build GitHub Galaxy history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_GALAXY_USERNAME: CesarSGZ
        run: node scripts/build-github-galaxy.mjs

      - name: Set up test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate remote browser boundaries
        run: node --test tests/remote-browser.test.mjs tests/remote-upload.test.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: pages deploy . --project-name=cesar-solla --branch=main
