name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build current GitHub Galaxy snapshot
        run: node scripts/build-github-galaxy.mjs

      - name: Set up Node for regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression checks
        run: node --test tests/*.test.mjs

      - name: Initialise multiplayer storage
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: d1 execute cesar-mission-control --remote --file=migrations/0012_doors_game.sql

      - name: Publish website and multiplayer game
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: pages deploy . --project-name=cesar-solla --branch=main
