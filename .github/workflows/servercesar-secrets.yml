name: ServerCesar secrets to Cloudflare Pages

# Copies the Wake-on-LAN target from encrypted GitHub secrets to encrypted Cloudflare
# Pages secrets, so Mission Control can prefill it without the public repository ever
# containing the home address. Run manually after changing any SERVERCESAR_* secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Copy secrets to the cesar-solla Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVERCESAR_MAC: ${{ secrets.SERVERCESAR_MAC }}
          SERVERCESAR_HOST: ${{ secrets.SERVERCESAR_HOST }}
          SERVERCESAR_WOL_PORT: ${{ secrets.SERVERCESAR_WOL_PORT }}
          SERVERCESAR_PROBE_PORTS: ${{ secrets.SERVERCESAR_PROBE_PORTS }}
          SERVERCESAR_AGENT_TOKEN: ${{ secrets.SERVERCESAR_AGENT_TOKEN }}
        run: |
          for name in SERVERCESAR_MAC SERVERCESAR_HOST SERVERCESAR_WOL_PORT SERVERCESAR_PROBE_PORTS SERVERCESAR_AGENT_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.124.0 pages secret put "$name" --project-name=cesar-solla
            fi
          done
