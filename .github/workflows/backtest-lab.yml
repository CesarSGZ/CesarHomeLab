name: Backtest Lab

# Cada 10 minutos mira si hay una petición lanzada desde Mission Control (no hace nada si no la hay).
# Los sábados recalcula con los parámetros por defecto y datos frescos.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 5 * * 6'

permissions:
  contents: read

concurrency:
  group: backtest-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Is there a backtest to run?
        id: claim
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/backtest-lab.mjs claim "$RUNNER_TEMP/params.json" ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 6') && 'weekly' || '' }}

      - uses: actions/setup-python@v5
        if: steps.claim.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backtest-lab/requirements.txt

      - name: Restore market data cache
        if: steps.claim.outputs.run == 'true'
        id: datos
        uses: actions/cache/restore@v4
        with:
          path: backtest-lab/datos_global
          key: backtest-global-${{ github.run_id }}
          restore-keys: backtest-global-

      - name: Download data from Yahoo Finance
        if: steps.claim.outputs.run == 'true'
        working-directory: backtest-lab
        run: |
          pip install -q -r requirements.txt
          [ -f datos_global/universo.csv ] || python universo.py
          # precios del último mes (o todo si no hay copia) + fundamentales por tandas, con tope de tiempo
          python descargar_global.py semanal 150 || echo "::warning::descarga incompleta, se usan los datos en caché"

      - name: Download SEC accounts (US, since 2009)
        if: steps.claim.outputs.run == 'true'
        working-directory: backtest-lab
        # fichero completo de la SEC (~1,4 GB); solo se reescriben las empresas con cuentas nuevas
        run: python descargar_sec.py --zip || echo "::warning::no se pudieron actualizar las cuentas de la SEC; se usan las de la caché"

      - name: Run backtest
        if: steps.claim.outputs.run == 'true'
        working-directory: backtest-lab
        run: python publicar.py --web "$RUNNER_TEMP/web.json" --origen "${{ steps.claim.outputs.trigger }}"

      - name: Keep the target portfolio for the IBKR paper robot
        if: steps.claim.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cartera-objetivo
          path: ${{ runner.temp }}/cartera_objetivo.json
          retention-days: 30

      - name: Publish results to Mission Control
        if: steps.claim.outputs.run == 'true'
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/backtest-lab.mjs publish "$RUNNER_TEMP/web.json"

      - name: Mark request as failed
        if: failure() && steps.claim.outputs.run == 'true'
        env:
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/backtest-lab.mjs fail "La ejecución en GitHub Actions falló (run ${{ github.run_id }})."

      - name: Save market data cache
        if: always() && steps.claim.outputs.run == 'true' && hashFiles('backtest-lab/datos_global/precios.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: backtest-lab/datos_global
          key: backtest-global-${{ github.run_id }}
