name: Agent Office infrastructure diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check existing service credentials without OAuth renewal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OFFICE_DEV_TOKEN: ${{ secrets.OFFICE_DEV_TOKEN }}
        run: node scripts/office-infrastructure-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-live-audit
          path: /tmp/office-live-audit.json
          retention-days: 3
