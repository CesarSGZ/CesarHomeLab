<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tareas</title>
  <script src="/theme.js?v=20261007night"></script>
  <meta name="theme-color" content="#071015">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/control/tareas/manifest.webmanifest">
  <link rel="icon" href="/assets/tareas-192.png">
  <link rel="apple-touch-icon" href="/assets/tareas-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tareas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/control/todo.css?v=20261124b">
  <style>
    /* The same night and grid as Mission Control. */
    html{background:#071015}
    body{margin:0;min-height:100dvh;color:#eef3ec;background:radial-gradient(circle at 85% 0,#14313b 0,transparent 35%),linear-gradient(rgba(82,217,255,.045) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(82,217,255,.045) 1px,transparent 1px) 0 0/48px 48px,#071015}
    html[data-theme=day],html[data-theme=day] body{background:#f2f6f8;color:#13232d}
    #todo-app{padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    #todo-app>p{margin:40vh 0 0;text-align:center;font:12px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#52d9ff}
  </style>
</head>
<body>
  <div id="todo-app"><p>Tareas · cargando</p></div>
  <script src="/control/todo.js?v=20261124b"></script>
  <script>
    (async () => {
      try {
        const r = await fetch('/control/api/session', { credentials: 'same-origin', headers: { accept: 'application/json' } });
        if (r.status === 401) { location.replace('/control/login?app=tareas'); return; }
        const session = await r.json();
        if (!session.ok || !session.access?.capabilities?.includes('todo:read')) { location.replace('/control/'); return; }
        window.TodoLab.initialise(session.csrfToken, { standalone: true });
      } catch {
        // Offline: the lists last seen on this phone still open, and changes wait until there is signal.
        window.TodoLab.initialise('', { standalone: true });
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/control/tareas/sw.js', { scope: '/control/tareas/' }).catch(() => {});
    })();
  </script>
</body>
</html>
